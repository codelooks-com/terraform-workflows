---
name: standard-ci
on:
  workflow_call:
    inputs:
      engine:
        type: string
        default: opentofu
      engine_version:
        type: string
        default: latest
      runner:
        type: string
        default: ubuntu-latest
      root_module_folder_relative_path:
        type: string
        default: "."
      op_secrets:
        type: string
        default: ""
      azure_oidc:
        description: 'Authenticate to Azure via GitHub OIDC (federated, no secrets). When true, sets ARM_* env from the inputs below and the job requests an id-token.'
        type: boolean
        default: false
      client_id:
        description: 'Azure AD application (client) ID for OIDC. Used for the plan/validate phase.'
        type: string
        default: ""
      tenant_id:
        type: string
        default: ""
      subscription_id:
        type: string
        default: ""
      backend_config:
        description: 'Multiline key=value list passed to init as -backend-config (for partial backend blocks, e.g. an empty azurerm block). Empty => bare init.'
        type: string
        default: ""
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: Validate & Plan
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: write
      id-token: write   # Azure OIDC (no-op unless a federated credential trusts this repo)
    concurrency:
      group: ${{ github.repository }}-tfstate
      cancel-in-progress: false
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      # Azure OIDC: empty/false for non-Azure repos (ignored when no azurerm provider).
      ARM_USE_OIDC: ${{ inputs.azure_oidc }}
      ARM_USE_AZUREAD: ${{ inputs.azure_oidc }}
      ARM_CLIENT_ID: ${{ inputs.client_id }}
      ARM_TENANT_ID: ${{ inputs.tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup engine
        id: engine
        uses: codelooks-com/terraform-workflows/.github/actions/setup-engine@main
        with:
          engine: ${{ inputs.engine }}
          engine_version: ${{ inputs.engine_version }}
      - name: Load 1Password secrets
        uses: codelooks-com/terraform-workflows/.github/actions/load-op-secrets@main
        with:
          op_secrets: ${{ inputs.op_secrets }}
      - name: Format check
        shell: bash
        run: ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" fmt -check -recursive
      - name: Init
        shell: bash
        env:
          BACKEND_CONFIG: ${{ inputs.backend_config }}
        run: |
          init_args=()
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            init_args+=( -backend-config="$line" )
          done <<< "$BACKEND_CONFIG"
          ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" init -input=false "${init_args[@]}"
      - name: Validate
        shell: bash
        run: ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" validate
      - name: Plan
        id: plan
        shell: bash
        run: |
          set +e
          ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" plan -input=false -no-color > plan.txt 2>&1
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          tail -c 60000 plan.txt
          exit "${code}"
      - name: Comment plan on PR
        if: (success() || failure()) && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let plan = '';
            try { plan = fs.readFileSync('plan.txt', 'utf8'); } catch (e) { plan = '(no plan output captured)'; }
            const truncated = plan.length > 60000 ? plan.slice(-60000) : plan;
            const body = `#### OpenTofu/Terraform Plan 📖 \`${{ steps.plan.outcome }}\`

            <details><summary>Show plan</summary>

            \`\`\`
            ${truncated}
            \`\`\`

            </details>

            *Pushed by @${{ github.actor }}*`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

---
name: standard-ci
on:
  workflow_call:
    inputs:
      engine:
        type: string
        default: opentofu
      engine_version:
        type: string
        default: latest
      runner:
        type: string
        default: ubuntu-latest
      root_module_folder_relative_path:
        type: string
        default: "."
    secrets:
      AWS_ACCESS_KEY_ID:
        required: false
      AWS_SECRET_ACCESS_KEY:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      TS_OAUTH_CLIENT_ID:
        required: false
      TS_OAUTH_SECRET:
        required: false
      NEXTDNS_API_KEY:
        required: false
      VSPHERE_USER:
        required: false
      VSPHERE_PASSWORD:
        required: false
      VSPHERE_SERVER:
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: Validate & Plan
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: ${{ github.repository }}-tfstate
      cancel-in-progress: false
    env:
      IN_AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      IN_AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      IN_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IN_TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      IN_TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
      IN_NEXTDNS_API_KEY: ${{ secrets.NEXTDNS_API_KEY }}
      IN_VSPHERE_USER: ${{ secrets.VSPHERE_USER }}
      IN_VSPHERE_PASSWORD: ${{ secrets.VSPHERE_PASSWORD }}
      IN_VSPHERE_SERVER: ${{ secrets.VSPHERE_SERVER }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup engine
        id: engine
        uses: codelooks-com/terraform-workflows/.github/actions/setup-engine@main
        with:
          engine: ${{ inputs.engine }}
          engine_version: ${{ inputs.engine_version }}

      - name: Resolve credentials
        uses: codelooks-com/terraform-workflows/.github/actions/resolve-creds@main

      - name: Format check
        shell: bash
        run: ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" fmt -check -recursive

      - name: Init
        shell: bash
        run: ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" init -input=false

      - name: Validate
        shell: bash
        run: ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" validate

      - name: Plan
        id: plan
        shell: bash
        run: |
          set +e
          ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" plan -input=false -no-color > plan.txt 2>&1
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          tail -c 60000 plan.txt
          exit "${code}"

      - name: Comment plan on PR
        if: (success() || failure()) && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let plan = '';
            try { plan = fs.readFileSync('plan.txt', 'utf8'); } catch (e) { plan = '(no plan output captured)'; }
            const truncated = plan.length > 60000 ? plan.slice(-60000) : plan;
            const body = `#### OpenTofu/Terraform Plan 📖 \`${{ steps.plan.outcome }}\`

            <details><summary>Show plan</summary>

            \`\`\`
            ${truncated}
            \`\`\`

            </details>

            *Pushed by @${{ github.actor }}*`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

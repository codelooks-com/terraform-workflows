---
name: standard-ci
on:
  workflow_call:
    inputs:
      engine:
        type: string
        default: opentofu
      engine_version:
        # Deliberately pinned (assumes the default engine, opentofu): a new release
        # must land as a reviewed bump, never silently change what CI runs.
        # Renovate bumps this. Callers should still pin explicitly.
        type: string
        default: "1.12.3"
      runner:
        type: string
        default: ubuntu-latest
      root_module_folder_relative_path:
        type: string
        default: "."
      op_secrets:
        type: string
        default: ""
      azure_oidc:
        description: 'Authenticate to Azure via GitHub OIDC (federated, no secrets). When true, sets ARM_* env from the inputs below and the job requests an id-token.'
        type: boolean
        default: false
      client_id:
        description: 'Azure AD application (client) ID for OIDC. Used for the plan/validate phase.'
        type: string
        default: ""
      tenant_id:
        type: string
        default: ""
      subscription_id:
        type: string
        default: ""
      backend_config:
        description: 'Multiline key=value list passed to init as -backend-config (for partial backend blocks, e.g. an empty azurerm block). Empty => bare init.'
        type: string
        default: ""
      extra_env:
        description: 'Multiline KEY=value list exported into the job env before init/plan/apply (e.g. provider tuning like AZAPI_RETRY_GET_AFTER_PUT_MAX_TIME).'
        type: string
        default: ""
      environment:
        description: 'Optional GitHub Environment to bind the plan job to. Needed when the repo customizes the OIDC subject to require the environment claim. Empty => no environment.'
        type: string
        default: ""
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: false

# No permissions: block here on purpose. Permissions are INHERITED from the
# calling workflow's job so OIDC callers can grant `id-token: write` while
# non-OIDC callers don't. A reusable workflow can only DOWNGRADE the caller's
# token, so hardcoding `id-token: write` makes startup fail for any caller that
# doesn't grant it (cloudflare/tailscale/nextdns/github). Each caller declares
# exactly what it needs (CI callers: contents: read + pull-requests: write;
# Azure additionally grants id-token: write).

jobs:
  plan:
    name: Validate & Plan
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    concurrency:
      # Keyed on the ROOT MODULE, not just the repo: matrix callers (terraform-azure-workloads
      # runs one leg per workload) have a separate state file per root module, so a
      # repo-wide group makes independent legs queue against each other — and GitHub
      # cancels the older *waiting* run when a second one arrives, silently leaving a
      # workload unapplied. Same root module still serialises, which is the point.
      group: ${{ github.repository }}-${{ inputs.root_module_folder_relative_path }}-tfstate
      cancel-in-progress: false
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      # Azure OIDC: empty/false for non-Azure repos (ignored when no azurerm provider).
      ARM_USE_OIDC: ${{ inputs.azure_oidc }}
      ARM_USE_AZUREAD: ${{ inputs.azure_oidc }}
      ARM_CLIENT_ID: ${{ inputs.client_id }}
      ARM_TENANT_ID: ${{ inputs.tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup engine
        id: engine
        uses: codelooks-com/terraform-workflows/.github/actions/setup-engine@v1.0.1
        with:
          engine: ${{ inputs.engine }}
          engine_version: ${{ inputs.engine_version }}
      - name: Export extra env
        shell: bash
        env:
          EXTRA_ENV: ${{ inputs.extra_env }}
        run: |
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            echo "$line" >> "$GITHUB_ENV"
          done <<< "$EXTRA_ENV"
      - name: Load 1Password secrets
        uses: codelooks-com/terraform-workflows/.github/actions/load-op-secrets@v1.0.1
        with:
          op_secrets: ${{ inputs.op_secrets }}
      - name: Format check
        shell: bash
        run: ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" fmt -check -recursive
      - name: Init
        shell: bash
        env:
          BACKEND_CONFIG: ${{ inputs.backend_config }}
        run: |
          init_args=()
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            init_args+=( -backend-config="$line" )
          done <<< "$BACKEND_CONFIG"
          ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" init -input=false "${init_args[@]}"
      - name: Validate
        shell: bash
        run: ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" validate
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.63.1
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: TFLint
        shell: bash
        env:
          # tflint --init fetches rule plugins from GitHub releases; the token
          # avoids anonymous API rate limits.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Blocking lint gate (estate decision 2026-07-06). Uses the repo-root
          # .tflint.hcl when present (absolute path so it applies in --recursive
          # mode); repos without one get tflint's default terraform ruleset.
          config_args=()
          if [ -f .tflint.hcl ]; then
            config_args=( --config "$(pwd)/.tflint.hcl" )
          fi
          tflint --init "${config_args[@]}"
          cd "${{ inputs.root_module_folder_relative_path }}"
          tflint "${config_args[@]}" --recursive -f compact
      - name: Plan
        id: plan
        shell: bash
        run: |
          set +e
          ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" plan -input=false -no-color > plan.txt 2>&1
          code=$?
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"
          tail -c 60000 plan.txt
          exit "${code}"
      - name: Comment plan on PR
        if: (success() || failure()) && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let plan = '';
            try { plan = fs.readFileSync('plan.txt', 'utf8'); } catch (e) { plan = '(no plan output captured)'; }
            const truncated = plan.length > 60000 ? plan.slice(-60000) : plan;
            const body = `#### OpenTofu/Terraform Plan 📖 \`${{ steps.plan.outcome }}\`

            <details><summary>Show plan</summary>

            \`\`\`
            ${truncated}
            \`\`\`

            </details>

            *Pushed by @${{ github.actor }}*`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

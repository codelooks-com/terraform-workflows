---
name: standard-drift
on:
  workflow_call:
    inputs:
      engine:
        type: string
        default: opentofu
      engine_version:
        # Deliberately pinned (assumes the default engine, opentofu): a new release
        # must land as a reviewed bump, never silently change what CI runs.
        # Renovate bumps this. Callers should still pin explicitly.
        type: string
        default: "1.12.3"
      runner:
        type: string
        default: ubuntu-latest
      root_module_folder_relative_path:
        type: string
        default: "."
      op_secrets:
        type: string
        default: ""
      azure_oidc:
        description: 'Authenticate to Azure via GitHub OIDC (federated, no secrets). When true, sets ARM_* env and the job requests an id-token.'
        type: boolean
        default: false
      client_id:
        description: 'Azure AD application (client) ID for OIDC. Drift only plans, so a read-only plan SP is appropriate.'
        type: string
        default: ""
      tenant_id:
        type: string
        default: ""
      subscription_id:
        type: string
        default: ""
      backend_config:
        description: 'Multiline key=value list passed to init as -backend-config (for partial backend blocks, e.g. an empty azurerm block). Empty => bare init.'
        type: string
        default: ""
      extra_env:
        description: 'Multiline KEY=value list exported into the job env before init/plan/apply (e.g. provider tuning like AZAPI_RETRY_GET_AFTER_PUT_MAX_TIME).'
        type: string
        default: ""
      environment:
        description: 'Optional GitHub Environment to bind the drift job to. Needed when the OIDC federated credential subject requires the environment claim (e.g. terraform-azure-workloads). Empty => no environment.'
        type: string
        default: ""
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: false

# No permissions: block here on purpose. Permissions are INHERITED from the
# calling workflow's job so OIDC callers can grant `id-token: write` while
# non-OIDC callers don't. A reusable workflow can only DOWNGRADE the caller's
# token, so hardcoding `id-token: write` makes startup fail for any caller that
# doesn't grant it. Each caller declares what it needs (drift callers: contents:
# read + issues: write).

jobs:
  drift:
    name: Detect drift
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    concurrency:
      # Keyed on the ROOT MODULE, not just the repo: matrix callers (terraform-azure-workloads
      # runs one leg per workload) have a separate state file per root module, so a
      # repo-wide group makes independent legs queue against each other — and GitHub
      # cancels the older *waiting* run when a second one arrives, silently leaving a
      # workload unapplied. Same root module still serialises, which is the point.
      group: ${{ github.repository }}-${{ inputs.root_module_folder_relative_path }}-tfstate
      cancel-in-progress: false
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      ARM_USE_OIDC: ${{ inputs.azure_oidc }}
      ARM_USE_AZUREAD: ${{ inputs.azure_oidc }}
      ARM_CLIENT_ID: ${{ inputs.client_id }}
      ARM_TENANT_ID: ${{ inputs.tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup engine
        id: engine
        uses: codelooks-com/terraform-workflows/.github/actions/setup-engine@v1.0.2
        with:
          engine: ${{ inputs.engine }}
          engine_version: ${{ inputs.engine_version }}
      - name: Export extra env
        shell: bash
        env:
          EXTRA_ENV: ${{ inputs.extra_env }}
        run: |
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            echo "$line" >> "$GITHUB_ENV"
          done <<< "$EXTRA_ENV"
      - name: Load 1Password secrets
        uses: codelooks-com/terraform-workflows/.github/actions/load-op-secrets@v1.0.2
        with:
          op_secrets: ${{ inputs.op_secrets }}
      - name: Init
        shell: bash
        env:
          BACKEND_CONFIG: ${{ inputs.backend_config }}
        run: |
          init_args=()
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            init_args+=( -backend-config="$line" )
          done <<< "$BACKEND_CONFIG"
          ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" init -input=false "${init_args[@]}"
      - name: Plan (detailed exit code)
        id: plan
        shell: bash
        env:
          ROOT_MODULE: ${{ inputs.root_module_folder_relative_path }}
        run: |
          set +e
          ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" plan -input=false -detailed-exitcode -no-color > plan.txt 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

          # Artifact name scoped to the root module so matrix callers don't collide,
          # matching standard-ci.yaml's plan-output-<root module> naming.
          slug="$(printf '%s' "${ROOT_MODULE}" | tr -c 'A-Za-z0-9_' '-' | sed 's/^-*//;s/-*$//')"
          echo "artifact=drift-plan-${slug:-root}" >> "$GITHUB_OUTPUT"
      - name: Upload full plan output
        id: upload
        # Runs whenever the plan step produced a file, including when the plan failed.
        if: (success() || failure()) && hashFiles('plan.txt') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.plan.outputs.artifact }}
          path: plan.txt
          retention-days: 14
          if-no-files-found: ignore
          overwrite: true
      - name: Decide
        id: decide
        uses: codelooks-com/terraform-workflows/.github/actions/drift-decide@v1.0.2
        with:
          exit_code: ${{ steps.plan.outputs.exit_code }}
      - name: Manage drift issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ARTIFACT_NAME: ${{ steps.plan.outputs.artifact }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const action = '${{ steps.decide.outputs.action }}';
            const label = 'terraform-drift';
            const title = `Terraform drift detected: ${context.repo.repo}`;
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label });
            const open = existing.data.find(i => i.title === title);
            if (action === 'none') {
              if (open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: 'Drift cleared ✅ — closing.' });
                await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed' });
              }
              return;
            }
            let plan = '';
            try { plan = fs.readFileSync('plan.txt', 'utf8'); } catch (e) { plan = '(no plan output captured)'; }
            // Counts come from the FULL plan so a reader can reconcile them against
            // the Plan: line even when the body below is only part of it.
            const count = (text, kinds) => (text.match(new RegExp(`^\\s*# .* (${kinds})`, 'gm')) || []).length;
            const all = 'will be created|will be destroyed|must be replaced|will be replaced|will be updated in-place|will be read during apply';
            const headers = count(plan, all);
            const breakdown = `${count(plan, 'will be created')} create, ${count(plan, 'will be updated in-place')} update, ${count(plan, 'must be replaced|will be replaced')} replace, ${count(plan, 'will be destroyed')} destroy, ${count(plan, 'will be read during apply')} read`;
            const summary = (plan.match(/^(Plan:|No changes\.).*$/m) || ['(no Plan: line in the output)'])[0];
            // Prefer truncating from the first resource-header marker onward — this
            // drops the leading "Refreshing state..." noise, which is usually most of
            // a large plan and never where the drift actually is — before falling back
            // to a tail slice when even that is still too long (or absent, e.g. a
            // failed plan with no diff at all).
            const LIMIT = 60000;
            const marker = plan.match(/^(OpenTofu|Terraform) will perform the following actions:/m);
            const fromMarker = marker ? plan.slice(marker.index) : null;
            const truncated = plan.length <= LIMIT ? plan
              : (fromMarker && fromMarker.length <= LIMIT) ? fromMarker
              : plan.slice(-LIMIT);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifact = process.env.ARTIFACT_URL
              ? `[\`${process.env.ARTIFACT_NAME}\`](${process.env.ARTIFACT_URL})`
              : `\`${process.env.ARTIFACT_NAME}\``;
            const notice = truncated === plan ? '' : `
            > [!WARNING]
            > Plan output truncated — ${headers} resource headers total, ${count(truncated, all)} shown below; full plan was uploaded as the ${artifact} artifact of [the run that last updated this issue](${runUrl}). Artifacts expire after 14 days, so it may be gone if this issue has been open longer.
            `;
            const heading = action === 'error' ? '⚠️ Drift check **errored**' : '🌱 **Drift detected**';
            const body = `${heading} on \`${context.sha.slice(0,7)}\` (run ${context.runId}).

            **${summary}**
            ${headers} resource headers in the full plan: ${breakdown}.
            ${notice}
            <details><summary>Plan output</summary>

            \`\`\`
            ${truncated}
            \`\`\`

            </details>`;
            if (open) {
              await github.rest.issues.update({ owner, repo, issue_number: open.number, body });
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `Re-checked: still ${action}.` });
            } else {
              await github.rest.issues.create({ owner, repo, title, labels: [label], body });
            }
      - name: Notify
        if: steps.decide.outputs.action != 'none' && env.DRIFT_WEBHOOK != ''
        shell: bash
        run: |
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"Terraform drift (${{ steps.decide.outputs.action }}) in ${{ github.repository }} — see issues\"}" \
            "$DRIFT_WEBHOOK" || echo "notification failed (non-fatal)"
      - name: Fail on error
        if: steps.decide.outputs.action == 'error'
        shell: bash
        run: exit 1

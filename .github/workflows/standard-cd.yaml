---
name: standard-cd
on:
  workflow_call:
    inputs:
      engine:
        type: string
        default: opentofu
      engine_version:
        # Deliberately pinned (assumes the default engine, opentofu): a new release
        # must land as a reviewed bump, never silently change what CI runs.
        # Renovate bumps this. Callers should still pin explicitly.
        type: string
        default: "1.12.3"
      runner:
        type: string
        default: ubuntu-latest
      root_module_folder_relative_path:
        type: string
        default: "."
      op_secrets:
        type: string
        default: ""
      plan_environment:
        type: string
        required: true
      apply_environment:
        type: string
        required: true
      action:
        type: string
        default: apply
      azure_oidc:
        description: 'Authenticate to Azure via GitHub OIDC (federated, no secrets). When true, sets ARM_* env and both jobs request an id-token.'
        type: boolean
        default: false
      plan_client_id:
        description: 'Azure AD application (client) ID used by the plan job (e.g. a read-only plan SP).'
        type: string
        default: ""
      apply_client_id:
        description: 'Azure AD application (client) ID used by the apply job (e.g. a write apply SP). May differ from plan_client_id to keep least privilege.'
        type: string
        default: ""
      tenant_id:
        type: string
        default: ""
      subscription_id:
        type: string
        default: ""
      backend_config:
        description: 'Multiline key=value list passed to init as -backend-config (for partial backend blocks, e.g. an empty azurerm block). Empty => bare init.'
        type: string
        default: ""
      extra_env:
        description: 'Multiline KEY=value list exported into the job env before init/plan/apply (e.g. provider tuning like AZAPI_RETRY_GET_AFTER_PUT_MAX_TIME).'
        type: string
        default: ""
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: false

# No permissions: block here on purpose. Permissions are INHERITED from the
# calling workflow's job so OIDC callers can grant `id-token: write` while
# non-OIDC callers don't. A reusable workflow can only DOWNGRADE the caller's
# token, so hardcoding `id-token: write` makes startup fail for any caller that
# doesn't grant it. Each caller declares what it needs (CD callers: contents:
# read; Azure additionally grants id-token: write).

jobs:
  plan:
    name: Plan
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.plan_environment }}
    concurrency:
      # Keyed on the ROOT MODULE, not just the repo: matrix callers (terraform-azure-workloads
      # runs one leg per workload) have a separate state file per root module, so a
      # repo-wide group makes independent legs queue against each other — and GitHub
      # cancels the older *waiting* run when a second one arrives, silently leaving a
      # workload unapplied. Same root module still serialises, which is the point.
      group: ${{ github.repository }}-${{ inputs.root_module_folder_relative_path }}-tfstate
      cancel-in-progress: false
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      ARM_USE_OIDC: ${{ inputs.azure_oidc }}
      ARM_USE_AZUREAD: ${{ inputs.azure_oidc }}
      ARM_CLIENT_ID: ${{ inputs.plan_client_id }}
      ARM_TENANT_ID: ${{ inputs.tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup engine
        id: engine
        uses: codelooks-com/terraform-workflows/.github/actions/setup-engine@v1.0.1
        with:
          engine: ${{ inputs.engine }}
          engine_version: ${{ inputs.engine_version }}
      - name: Export extra env
        shell: bash
        env:
          EXTRA_ENV: ${{ inputs.extra_env }}
        run: |
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            echo "$line" >> "$GITHUB_ENV"
          done <<< "$EXTRA_ENV"
      - name: Load 1Password secrets
        uses: codelooks-com/terraform-workflows/.github/actions/load-op-secrets@v1.0.1
        with:
          op_secrets: ${{ inputs.op_secrets }}
      - name: Init
        shell: bash
        env:
          BACKEND_CONFIG: ${{ inputs.backend_config }}
        run: |
          init_args=()
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            init_args+=( -backend-config="$line" )
          done <<< "$BACKEND_CONFIG"
          ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" init -input=false "${init_args[@]}"
      - name: Plan
        shell: bash
        run: |
          ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" plan -input=false -out=tfplan ${{ inputs.action == 'destroy' && '-destroy' || '' }}
      - name: Artifact name
        id: artifact
        shell: bash
        # Matrix callers (e.g. terraform-azure-workloads) run several root modules
        # in one workflow run; a fixed artifact name collides and the apply jobs
        # download each other's plans ("Saved plan is stale"). Scope the name to
        # the root module path.
        run: echo "name=tfplan-$(printf '%s' "${{ inputs.root_module_folder_relative_path }}" | tr './' '--')" >> "$GITHUB_OUTPUT"
      - name: Upload plan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ inputs.root_module_folder_relative_path }}/tfplan
          retention-days: 5
          if-no-files-found: error
  apply:
    name: Apply
    needs: plan
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.apply_environment }}
    concurrency:
      # Same group key as the plan job above — see the note there.
      group: ${{ github.repository }}-${{ inputs.root_module_folder_relative_path }}-tfstate
      cancel-in-progress: false
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      ARM_USE_OIDC: ${{ inputs.azure_oidc }}
      ARM_USE_AZUREAD: ${{ inputs.azure_oidc }}
      ARM_CLIENT_ID: ${{ inputs.apply_client_id }}
      ARM_TENANT_ID: ${{ inputs.tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Setup engine
        id: engine
        uses: codelooks-com/terraform-workflows/.github/actions/setup-engine@v1.0.1
        with:
          engine: ${{ inputs.engine }}
          engine_version: ${{ inputs.engine_version }}
      - name: Export extra env
        shell: bash
        env:
          EXTRA_ENV: ${{ inputs.extra_env }}
        run: |
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            echo "$line" >> "$GITHUB_ENV"
          done <<< "$EXTRA_ENV"
      - name: Load 1Password secrets
        uses: codelooks-com/terraform-workflows/.github/actions/load-op-secrets@v1.0.1
        with:
          op_secrets: ${{ inputs.op_secrets }}
      - name: Init
        shell: bash
        env:
          BACKEND_CONFIG: ${{ inputs.backend_config }}
        run: |
          init_args=()
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            init_args+=( -backend-config="$line" )
          done <<< "$BACKEND_CONFIG"
          ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" init -input=false "${init_args[@]}"
      - name: Artifact name
        id: artifact
        shell: bash
        # Must match the plan job's computation exactly.
        run: echo "name=tfplan-$(printf '%s' "${{ inputs.root_module_folder_relative_path }}" | tr './' '--')" >> "$GITHUB_OUTPUT"
      - name: Download plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: ${{ inputs.root_module_folder_relative_path }}
      - name: Apply
        shell: bash
        run: ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" apply -input=false -auto-approve tfplan

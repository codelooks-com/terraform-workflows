---
name: standard-cd
on:
  workflow_call:
    inputs:
      engine:
        type: string
        default: opentofu
      engine_version:
        type: string
        default: latest
      runner:
        type: string
        default: ubuntu-latest
      root_module_folder_relative_path:
        type: string
        default: "."
      op_secrets:
        type: string
        default: ""
      plan_environment:
        type: string
        required: true
      apply_environment:
        type: string
        required: true
      action:
        type: string
        default: apply
      azure_oidc:
        description: 'Authenticate to Azure via GitHub OIDC (federated, no secrets). When true, sets ARM_* env and both jobs request an id-token.'
        type: boolean
        default: false
      plan_client_id:
        description: 'Azure AD application (client) ID used by the plan job (e.g. a read-only plan SP).'
        type: string
        default: ""
      apply_client_id:
        description: 'Azure AD application (client) ID used by the apply job (e.g. a write apply SP). May differ from plan_client_id to keep least privilege.'
        type: string
        default: ""
      tenant_id:
        type: string
        default: ""
      subscription_id:
        type: string
        default: ""
      backend_config:
        description: 'Multiline key=value list passed to init as -backend-config (for partial backend blocks, e.g. an empty azurerm block). Empty => bare init.'
        type: string
        default: ""
    secrets:
      OP_SERVICE_ACCOUNT_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.plan_environment }}
    permissions:
      contents: read
      id-token: write   # Azure OIDC (no-op unless a federated credential trusts this repo)
    concurrency:
      group: ${{ github.repository }}-tfstate
      cancel-in-progress: false
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      ARM_USE_OIDC: ${{ inputs.azure_oidc }}
      ARM_USE_AZUREAD: ${{ inputs.azure_oidc }}
      ARM_CLIENT_ID: ${{ inputs.plan_client_id }}
      ARM_TENANT_ID: ${{ inputs.tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup engine
        id: engine
        uses: codelooks-com/terraform-workflows/.github/actions/setup-engine@main
        with:
          engine: ${{ inputs.engine }}
          engine_version: ${{ inputs.engine_version }}
      - name: Load 1Password secrets
        uses: codelooks-com/terraform-workflows/.github/actions/load-op-secrets@main
        with:
          op_secrets: ${{ inputs.op_secrets }}
      - name: Init
        shell: bash
        env:
          BACKEND_CONFIG: ${{ inputs.backend_config }}
        run: |
          init_args=()
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            init_args+=( -backend-config="$line" )
          done <<< "$BACKEND_CONFIG"
          ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" init -input=false "${init_args[@]}"
      - name: Plan
        shell: bash
        run: |
          ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" plan -input=false -out=tfplan ${{ inputs.action == 'destroy' && '-destroy' || '' }}
      - name: Upload plan artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan
          path: ${{ inputs.root_module_folder_relative_path }}/tfplan
          retention-days: 5
          if-no-files-found: error
  apply:
    name: Apply
    needs: plan
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.apply_environment }}
    permissions:
      contents: read
      id-token: write   # Azure OIDC (no-op unless a federated credential trusts this repo)
    concurrency:
      group: ${{ github.repository }}-tfstate
      cancel-in-progress: false
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
      ARM_USE_OIDC: ${{ inputs.azure_oidc }}
      ARM_USE_AZUREAD: ${{ inputs.azure_oidc }}
      ARM_CLIENT_ID: ${{ inputs.apply_client_id }}
      ARM_TENANT_ID: ${{ inputs.tenant_id }}
      ARM_SUBSCRIPTION_ID: ${{ inputs.subscription_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup engine
        id: engine
        uses: codelooks-com/terraform-workflows/.github/actions/setup-engine@main
        with:
          engine: ${{ inputs.engine }}
          engine_version: ${{ inputs.engine_version }}
      - name: Load 1Password secrets
        uses: codelooks-com/terraform-workflows/.github/actions/load-op-secrets@main
        with:
          op_secrets: ${{ inputs.op_secrets }}
      - name: Init
        shell: bash
        env:
          BACKEND_CONFIG: ${{ inputs.backend_config }}
        run: |
          init_args=()
          while IFS= read -r line; do
            line="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            init_args+=( -backend-config="$line" )
          done <<< "$BACKEND_CONFIG"
          ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" init -input=false "${init_args[@]}"
      - name: Download plan artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tfplan
          path: ${{ inputs.root_module_folder_relative_path }}
      - name: Apply
        shell: bash
        run: ${{ steps.engine.outputs.bin }} -chdir="${{ inputs.root_module_folder_relative_path }}" apply -input=false -auto-approve tfplan

---
name: setup-engine
description: Install OpenTofu or Terraform and expose the binary name as an output.
inputs:
  engine:
    description: opentofu | terraform
    default: opentofu
  engine_version:
    description: CLI version, or 'latest'.
    default: latest
outputs:
  bin:
    description: The CLI binary name (tofu | terraform).
    value: ${{ steps.set.outputs.bin }}
runs:
  using: composite
  steps:
    - name: Install OpenTofu
      if: inputs.engine == 'opentofu'
      uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
      with:
        tofu_version: ${{ inputs.engine_version }}
        tofu_wrapper: false
    - name: Install Terraform
      if: inputs.engine == 'terraform'
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ inputs.engine_version }}
        terraform_wrapper: false
    - name: Set binary name
      id: set
      shell: bash
      run: |
        if [ "${{ inputs.engine }}" = "terraform" ]; then
          echo "bin=terraform" >> "$GITHUB_OUTPUT"
        else
          echo "bin=tofu" >> "$GITHUB_OUTPUT"
        fi

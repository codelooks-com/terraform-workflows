---
name: load-op-secrets
description: Resolve op:// references into the job environment via 1Password. No-op when no service-account token or no references are provided (ARC cluster runners use pod envFrom instead).
inputs:
  op_secrets:
    description: Multiline list of ENV_NAME=op://vault/item/field references to load.
    default: ""
runs:
  using: composite
  steps:
    - name: Stage op references
      id: stage
      shell: bash
      env:
        OP_SECRETS: ${{ inputs.op_secrets }}
      # Writing to $GITHUB_ENV is the point of this step: load-secrets-action resolves op:// refs it
      # finds in the environment. Each line is checked below, so only NAME=op://... can be staged.
      run: | # zizmor: ignore[github-env]
        set -euo pipefail
        if [ -z "${OP_SERVICE_ACCOUNT_TOKEN:-}" ] || [ -z "$(printf '%s' "${OP_SECRETS}" | tr -d '[:space:]')" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "1Password load skipped (no OP_SERVICE_ACCOUNT_TOKEN or no op_secrets); using runner-provided env."
          exit 0
        fi
        echo "skip=false" >> "$GITHUB_OUTPUT"
        # Stage each ENV=op://ref line into $GITHUB_ENV so load-secrets-action resolves it.
        while IFS= read -r line; do
          trimmed="$(printf '%s' "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [ -z "$trimmed" ] && continue
          name="${trimmed%%=*}"
          if [[ ! "$trimmed" =~ ^[A-Za-z_][A-Za-z0-9_]*=op://[^[:cntrl:]]+$ ]]; then
            echo "::error::op_secrets line for '${name}' is not NAME=op://vault/item/field"
            exit 1
          fi
          case "$name" in
            PATH | BASH_ENV | ENV | NODE_OPTIONS | LD_* | GITHUB_* | RUNNER_* | ACTIONS_* | OP_*)
              echo "::error::op_secrets may not set reserved variable '${name}'"
              exit 1
              ;;
          esac
          echo "$trimmed" >> "$GITHUB_ENV"
        done <<< "$OP_SECRETS"
    - name: Load secrets from 1Password
      if: steps.stage.outputs.skip == 'false'
      uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
      with:
        export-env: true
